<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#FAF9F6; --text:#2B2B2B; --sage:#4A6B52; --sage-tint:#DCE5DA;
    --terracotta:#A8654F; --gold:#C9A051; --muted:#5A5A56;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
    position:relative;overflow:hidden;
  }
  .name,.eyebrow,h1,.metric .v{
    font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-0.03em;
  }
  .frame{position:absolute;inset:0;border:14px solid var(--sage);}
  .content{
    position:absolute;inset:0;padding:56px 68px 64px;
    display:flex;align-items:stretch;gap:36px;
  }
  .col{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .name{font-size:29px;font-weight:700;letter-spacing:-0.02em}
  .rule{height:3px;width:48px;background:var(--gold)}
  .role{font-size:19px;color:var(--muted);font-weight:500}
  .eyebrow{
    font-size:18px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--sage);margin-bottom:18px;
  }
  h1{
    font-size:50px;line-height:1.06;font-weight:800;letter-spacing:-0.03em;
  }
  h1 .accent{color:var(--sage)}
  .metrics{display:flex;gap:30px}
  .metric .v{font-size:38px;font-weight:800;letter-spacing:-0.03em;color:var(--terracotta);line-height:1}
  .metric .l{font-size:15px;color:var(--muted);margin-top:7px;max-width:185px;line-height:1.32}
  .face{
    flex:0 0 252px;align-self:center;position:relative;
    width:252px;height:252px;
  }
  .face::before{
    content:"";position:absolute;inset:-10px;border-radius:50%;
    background:var(--sage-tint);
  }
  .face img{position:relative;width:252px;height:252px;display:block}
  .mountains{position:absolute;left:0;right:0;bottom:0;width:100%;display:block}
</style>
</head>
