<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#FAF9F6; --text:#2B2B2B; --sage:#4A6B52; --sage-tint:#DCE5DA;
    --terracotta:#A8654F; --gold:#C9A051; --muted:#5A5A56;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
    position:relative;overflow:hidden;
  }
  .name,.eyebrow,h1,.metric .v{
    font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-0.03em;
  }
  .frame{position:absolute;inset:0;border:14px solid var(--sage);}
  .content{
    position:absolute;inset:0;padding:56px 68px 64px;
    display:flex;align-items:stretch;gap:36px;
  }
  .col{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .name{font-size:29px;font-weight:700;letter-spacing:-0.02em}
  .rule{height:3px;width:48px;background:var(--gold)}
  .role{font-size:19px;color:var(--muted);font-weight:500}
  .eyebrow{
    font-size:18px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--sage);margin-bottom:18px;
  }
  h1{
    font-size:50px;line-height:1.06;font-weight:700;letter-spacing:-0.03em;
  }
  h1 .accent{color:var(--sage)}
  .metrics{display:flex;gap:30px}
  .metric .v{font-size:38px;font-weight:700;letter-spacing:-0.03em;color:var(--terracotta);line-height:1}
  .metric .l{font-size:15px;color:var(--muted);margin-top:7px;max-width:185px;line-height:1.32}
  .face{
    flex:0 0 252px;align-self:center;position:relative;
    width:252px;height:252px;border-radius:55px;
    background:var(--sage);
    display:flex;align-items:center;justify-content:center;
  }
  .face .mark{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size:112px;font-weight:700;letter-spacing:-0.02em;
    color:var(--bg);
  }
  .mountains{position:absolute;left:0;right:0;bottom:0;width:100%;display:block}
</style>
</head>
<body>
  <div class="frame"></div>
  <svg class="mountains" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true" style="height:96px">
    <path d="M0 120 L0 78 L300 30 L520 72 L780 22 L1010 66 L1200 40 L1200 120 Z" fill="#DCE5DA"/>
    <path d="M0 120 L0 96 L340 62 L600 96 L840 54 L1080 92 L1200 70 L1200 120 Z" fill="#4A6B52" opacity="0.9"/>
  </svg>
  <div class="content">
    <div class="col">
      <div class="top">
        <span class="name">Tim LaBarge</span>
        <span class="rule"></span>
        <span class="role">B2B SaaS Marketing Leader</span>
      </div>
      <div class="mid">
        <p class="eyebrow">15+ years going from zero to scaled &rarr; AI GTM &amp; AI-Native</p>
        <h1>Modern marketing leadership.<br><span class="accent">Built to scale, built to&nbsp;execute.</span></h1>
      </div>
      <div class="metrics">
        <div class="metric"><div class="v">$5.5MM+</div><div class="l">ARR from conversion optimization</div></div>
        <div class="metric"><div class="v">2,500+</div><div class="l">users on an AI product built from zero</div></div>
        <div class="metric"><div class="v">Millions</div><div class="l">in AI project pipeline</div></div>
      </div>
    </div>
    <div class="face"><span class="mark">TL</span></div>
  </div>
</body>
</html>
